name: Phase 1–3 checks
on:
  push:
    branches: [phase-1-foundation-security, phase-2-core-features, phase-3-ux-management]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt httpx pytest
      - name: Check Python source
        run: python -m compileall -q backend
      - name: Verify migration heads
        env:
          DATABASE_URL: sqlite:///./ux-ci.sqlite3
          SECRET_KEY: test-ci-secret-not-for-production
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          config = Config()
          config.set_main_option("script_location", "alembic")
          heads = ScriptDirectory.from_config(config).get_heads()
          assert len(heads) == 1, heads
          print("Migration head:", heads[0])
          PY
      - name: Phase 1 unit tests
        env:
          DATABASE_URL: sqlite:///./ux-ci.sqlite3
          SECRET_KEY: test-ci-secret-not-for-production
          PYTHONPATH: backend
          UX_ISOLATED_TESTS: "1"
          STAGING_MODE: "1"
        run: python -m pytest backend/tests -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/olympiad-frontend/package-lock.json
      - run: npm ci
        working-directory: frontend/olympiad-frontend
      - run: npx vitest run
        working-directory: frontend/olympiad-frontend
      - run: npm run build
        working-directory: frontend/olympiad-frontend
