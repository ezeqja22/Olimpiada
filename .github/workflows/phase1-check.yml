name: Phase 1–3 checks
on:
  push:
    branches: [phase-1-foundation-security, phase-2-core-features, phase-3-ux-management]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt httpx
      - name: Check Python source
        run: python -m compileall -q backend
      - name: Verify migration heads
        env:
          DATABASE_URL: sqlite:///./phase1-test.db
          SECRET_KEY: test-ci-secret-not-for-production
        run: alembic heads
      - name: Phase 1 unit tests
        env:
          DATABASE_URL: sqlite:///./phase1-test.db
          SECRET_KEY: test-ci-secret-not-for-production
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -p "test_*.py" -v
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/olympiad-frontend/package-lock.json
      - run: npm ci
        working-directory: frontend/olympiad-frontend
      - run: npm run build
        working-directory: frontend/olympiad-frontend
