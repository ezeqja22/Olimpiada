server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  location / { try_files $uri $uri/ /index.html; }
  location ~* \.(css|js|png|jpg|jpeg|webp|svg|ico|woff2?)$ {
    try_files $uri =404;
    expires 1h;
    add_header X-Content-Type-Options nosniff always;
  }
}
