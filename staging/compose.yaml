name: olimpiada-staging
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: olympiada_stage
      POSTGRES_USER: olimpiada_stage
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:?Set STAGING_DB_PASSWORD in .env.staging}
      PGPASSWORD: ${STAGING_DB_PASSWORD:?Set STAGING_DB_PASSWORD in .env.staging}
    volumes:
      - staging-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U olimpiada_stage -d olympiada_stage -tAc 'SELECT 1' | grep -qx 1"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [staging-internal]

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports: ["127.0.0.1:8025:8025"]
    networks: [staging-internal]

  migrate:
    build:
      context: ..
      dockerfile: staging/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://olimpiada_stage@db:5432/olympiada_stage
      PGPASSWORD: ${STAGING_DB_PASSWORD:?Set STAGING_DB_PASSWORD in .env.staging}
      SECRET_KEY: ${STAGING_SECRET_KEY:?Set STAGING_SECRET_KEY in .env.staging}
      STAGING_MODE: "1"
    command: ["python","staging/bootstrap.py"]
    depends_on:
      db: {condition: service_healthy}
    networks: [staging-internal]

  api:
    build:
      context: ..
      dockerfile: staging/backend.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://olimpiada_stage@db:5432/olympiada_stage
      PGPASSWORD: ${STAGING_DB_PASSWORD:?Set STAGING_DB_PASSWORD in .env.staging}
      SECRET_KEY: ${STAGING_SECRET_KEY:?Set STAGING_SECRET_KEY in .env.staging}
      FRONTEND_ORIGINS: http://localhost:5174,http://127.0.0.1:5174
      STAGING_MODE: "1"
      SMTP_SERVER: mailpit
      SMTP_PORT: "1025"
      SMTP_USERNAME: staging@olimpiada.test
      SMTP_USE_TLS: "false"
      EMAIL_FROM_ADDRESS: staging@olimpiada.test
      PYTHONPATH: /app/backend
    ports: ["127.0.0.1:8001:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      mailpit: {condition: service_started}
    networks: [staging-internal]

  frontend:
    build:
      context: ..
      dockerfile: staging/frontend.Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:8001
    restart: unless-stopped
    ports: ["127.0.0.1:5174:80"]
    depends_on: [api]
    networks: [staging-internal]

  cron:
    build:
      context: ..
      dockerfile: staging/backend.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://olimpiada_stage@db:5432/olympiada_stage
      PGPASSWORD: ${STAGING_DB_PASSWORD:?Set STAGING_DB_PASSWORD in .env.staging}
      SECRET_KEY: ${STAGING_SECRET_KEY:?Set STAGING_SECRET_KEY in .env.staging}
      STAGING_MODE: "1"
      SMTP_SERVER: mailpit
      SMTP_PORT: "1025"
      SMTP_USERNAME: staging@olimpiada.test
      SMTP_USE_TLS: "false"
      PYTHONPATH: /app/backend
    command: ["sh","-c","while :; do python backend/phase2_cron.py; sleep 60; done"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      mailpit: {condition: service_started}
    networks: [staging-internal]

networks:
  staging-internal: {driver: bridge}
volumes:
  staging-postgres:
